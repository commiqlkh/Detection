title: Excessive HTTP 5xx Responses From a Single Source
id: f8f07240-ef15-4ba4-98f4-524216e90f2b
name: suspicious_http_5xx_response_codes
status: experimental
description: Detects repeated HTTP server-error responses from the same source while excluding known Microsoft Graph, Azure AD, Datadog, and CrowdStrike connector activity.
author: commiqlkh
date: 2026-07-01
falsepositives:
  - Application outage or backend service failure
  - Misconfigured application integration
  - Legitimate load testing
level: medium

detection:
  selection_5xx:
    http.response.status_code|gte: 500
    http.response.status_code|lte: 599

  filter_graph:
    url.domain: graph.microsoft.com

  filter_azure_ad:
    action.name: Microsoft Graph Activity

  filter_datadog:
    aks.log.pod_log|contains: Datadog

  filter_crowdstrike:
    user_agent.original|contains: #####

  condition: selection_5xx and not 1 of filter_*
---
name: suspicious_http_5xx_response_codes_burst
action: correlation
type: event_count
rule: suspicious_http_5xx_response_codes
group-by:
  - http.response.status_code
  - user_agent.original
  - host.name
  - source.address
  - url.path
timespan: 1m
condition:
  gte: 20
